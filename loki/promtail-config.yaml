# Promtail — 通过 podman socket 自动发现容器，把 yw-mall-deploy_* 的
# JSON 日志解析后推给 Loki。
server:
  http_listen_port: 9080         # 注意：跟 APISIX 撞，但 Promtail 是容器内 9080，host 不暴露
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---- yw-mall-deploy 应用容器（go-zero JSON 日志）----
  - job_name: yw-mall-apps
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: name
            values: ["yw-mall-deploy_"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(yw-mall-deploy_(.*)_1)"
        target_label: container
        replacement: "${1}"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(yw-mall-deploy_(.*)_1)"
        target_label: service
        replacement: "${2}"
      - target_label: stack
        replacement: yw-mall
    pipeline_stages:
      # go-zero 日志是 JSON，解析后把关键字段抽出来
      - json:
          expressions:
            ts: "\"@timestamp\""
            level: level
            caller: caller
            content: content
            duration: duration
            span: span
            trace: trace
      - labels:
          level:
      - timestamp:
          source: ts
          format: "2006-01-02T15:04:05.000-07:00"
      # 把 content 字段作为日志正文，避免界面看到一大坨 JSON
      - output:
          source: content

  # ---- infra 容器（非 JSON，原样收集）----
  - job_name: infra
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: name
            values: ["mall-api", "mall-admin-api", "apisix", "proxysql",
                     "etcd1", "kafka1", "redis-master", "dtm", "mysql-master1"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
        replacement: "${1}"
      - target_label: stack
        replacement: infra
