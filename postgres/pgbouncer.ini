[databases]
; 业务库：默认指向 HAProxy 写入入口
postgres = host=pg-haproxy1 port=5000 dbname=postgres
mall     = host=pg-haproxy1 port=5000 dbname=mall

; 兜底 fallback：当 pg-haproxy1 异常时业务可以手动切到 pg-haproxy2
* = host=pg-haproxy1 port=5000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer
; auth_query 走 auth_user，可以避免在 userlist 里铺所有业务用户
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

admin_users = postgres
stats_users = postgres,exporter

pool_mode = transaction
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 400
max_db_connections = 100

server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0

; PgBouncer 本身 health 检查
;listen_backlog = 128
