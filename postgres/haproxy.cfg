global
    maxconn 1024
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 2
    timeout client          30m
    timeout connect          4s
    timeout server          30m
    timeout check            5s

# ============================================================
# Stats / Prometheus
# ============================================================
frontend stats
    mode http
    bind *:8008
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }

# ============================================================
# PG 写入入口（永远只指到 Patroni 当前 master）
# Patroni REST: GET /master → 200 当前节点是 master，否则 503
# ============================================================
frontend pg_write_front
    bind *:5000
    default_backend pg_write

backend pg_write
    option httpchk
    http-check send meth GET uri /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none
    server pg1 pg1:5432 maxconn 200 check port 8008
    server pg2 pg2:5432 maxconn 200 check port 8008
    server pg3 pg3:5432 maxconn 200 check port 8008

# ============================================================
# PG 只读入口（只把 replica 加进池，做轮询）
# Patroni REST: GET /replica → 200 是 replica
# ============================================================
frontend pg_read_front
    bind *:5001
    default_backend pg_read

backend pg_read
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none
    server pg1 pg1:5432 maxconn 200 check port 8008
    server pg2 pg2:5432 maxconn 200 check port 8008
    server pg3 pg3:5432 maxconn 200 check port 8008
