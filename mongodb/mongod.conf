# 参考 — 实际启动通过 compose command 参数注入。这里留作 review 用。
storage:
  dbPath: /data/db
  directoryPerDB: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      directoryForIndexes: true
      journalCompressor: snappy

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000

security:
  authorization: enabled
  keyFile: /etc/mongo/keyfile
  javascriptEnabled: true

replication:
  replSetName: rs0
  oplogSizeMB: 2048

operationProfiling:
  slowOpThresholdMs: 200
  mode: slowOp

setParameter:
  enableLocalhostAuthBypass: true
  notablescan: false
