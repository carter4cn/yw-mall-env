plugin_attr:
  prometheus:
    enable_export_server: true
    export_addr:
      ip: 0.0.0.0
      port: 9091
    export_uri: /apisix/prometheus/metrics
    metric_prefix: apisix_
  server-info:
    report_ttl: 60
  log-rotate:
    interval: 3600
    max_kept: 168
