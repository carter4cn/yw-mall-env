apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://es1:9200
    isDefault: true
    editable: true
    jsonData:
      timeField: "timestamp"
      esVersion: "9.3.3"
      logMessageField: "message"
      logLevelField: "level"

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
